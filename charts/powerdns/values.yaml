# Default values for powerdns.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


##
## PowerDNS configuration
##
powerdns:
  apikey: PowerDNSAPI
  webserver_allow_from: "192.168.0.0/16,172.16.0.0/16"
  initDomains: []

  service:
    type: ClusterIP
    # annotations: {}
    # ip
  image:
    repository: pschiffe/pdns-pgsql
    # leave tag blank to use app version
    tag:
    pullPolicy: IfNotPresent
  resources: {}

powerdnsadmin:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
    annotations: {}
    hosts:
      - host: powerdnsadmin.my.domain.com
        paths:
          - path: /
            pathType: Prefix
  image:
    repository: pschiffe/pdns-admin
    tag: 0.4.1
    pullPolicy: IfNotPresent
  resources: {}


##
## PostgreSQL Database configuration
##
postgres:
  user: powerdns
  password: powerdns
  name: powerdns

  service:
    type: ClusterIP
  image:
    repository: postgres
    tag: 18-alpine
    pullPolicy: IfNotPresent  
  resources: {}


adminer:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
    annotations: {}
    hosts:
      - host: adminer.my.domain.com
        paths:
          - path: /
            pathType: Prefix
  image:
    repository: adminer
    tag: 5
    pullPolicy: IfNotPresent
  resources: {}


nodeSelector: {}

tolerations: []

affinity: {}

