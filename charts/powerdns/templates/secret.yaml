apiVersion: v1
kind: Secret
metadata:
  name: {{ include "powerdns.fullname" . }}
  labels:
    app: {{ include "powerdns.name" . }}
type: Opaque
data:
  api-key: "{{ .Values.powerdns.apikey | b64enc }}"
  db-user: "{{ .Values.postgres.user | b64enc }}"
  db-password: "{{ .Values.postgres.password | b64enc}}"
  db-name: "{{ .Values.postgres.name | b64enc}}"