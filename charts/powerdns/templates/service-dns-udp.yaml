apiVersion: v1
kind: Service
metadata:
  name: {{ include "powerdns.fullname" . }}-dns-udp
  labels:
    app: {{ include "powerdns.name" . }}
  annotations:
{{ toYaml .Values.powerdns.service.annotations | indent 4 }}
spec:
  type: {{ .Values.powerdns.service.type }}
  {{- if .Values.powerdns.service.ip }}
  loadBalancerIP: {{ .Values.powerdns.service.ip }}
  {{- end}}
  ports:
    - port: 53
      targetPort: 53
      protocol: UDP
      name: dns-udp
  selector:
    app: {{ include "powerdns.name" . }}
    release: {{ .Release.Name }}
