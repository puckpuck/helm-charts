{{- if and .Values.powerdnsadmin.enabled .Values.powerdnsadmin.ingress.enabled }}
{{- $fullname := include "powerdns.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-pdns-admin
  labels:
    app: {{ include "powerdns.name" . }}-pdns-admin
  {{- with .Values.powerdnsadmin.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  {{- if .Values.powerdnsadmin.ingress.tls }}
  tls:
  {{- range .Values.powerdnsadmin.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
  {{- end }}
  rules:
  {{- range .Values.powerdnsadmin.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullname }}-pdns-admin
                port:
                  number: 8080
        {{- end }}
  {{- end }}
{{- end }}
